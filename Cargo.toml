[workspace]
resolver = "2"
members = [
    "crates/privcord-domain",
    "crates/privcord-crypto",
    "crates/privcord-ports",
    "crates/privcord-engine",
    "crates/privcord-storage",
    "crates/privcord-import",
    "crates/privcord-ffi",
    "crates/privcord-desktop-host",
]
# The existing Tauri shell keeps its own lockfile until milestone M7 moves it onto this workspace.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license-file = "LICENSE"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.23"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"
p256 = { version = "0.14", features = ["ecdsa", "ecdh", "arithmetic"] }
k256 = { version = "0.14", default-features = false, features = ["schnorr", "arithmetic", "std"] }
bip39 = "3"
# ML-KEM-768 (FIPS 203), post-quantum half of the hybrid key exchange; driven with seeds from our own entropy.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
ml-kem = { version = "0.2", features = ["deterministic", "zeroize"] }
getrandom = "0.2"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
proptest = "1"
privcord-domain = { path = "crates/privcord-domain" }
privcord-crypto = { path = "crates/privcord-crypto" }
privcord-ports = { path = "crates/privcord-ports" }
privcord-engine = { path = "crates/privcord-engine" }
privcord-storage = { path = "crates/privcord-storage" }
privcord-import = { path = "crates/privcord-import", default-features = false }

# Smaller, faster release builds: whole-program optimisation, one codegen unit, no symbol table.
# (Panics still unwind: the FFI layer catches them instead of aborting the app.)
[profile.release]
lto = true
codegen-units = 1
strip = true

# Argon2 (backup passphrases) is ~50x slower unoptimised; tests and debug builds would crawl.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# P-256 signing and checking: the sync-log simulations sign and verify thousands of entries.
[profile.dev.package.p256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
