[package]
name = "privcord-ffi"
description = "The narrow, stable facade the platform UIs call: plain data in and out, no keys, no runtime handles. Kotlin bindings are generated from it with UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

# The only crate allowed to contain `unsafe`: the UniFFI scaffolding it generates needs it. No hand-written unsafe lives here.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[features]
# Builds the `uniffi-bindgen` tool used to generate the Kotlin bindings.
cli = ["uniffi/cli"]
# Lets a host (the desktop shell) turn snapshots and events into JSON.
serde = ["dep:serde"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
privcord-domain.workspace = true
privcord-import = { workspace = true, features = ["readers"] }
privcord-crypto.workspace = true
privcord-ports.workspace = true
privcord-engine.workspace = true
privcord-storage.workspace = true
uniffi = "0.28"
pollster = "1"
thiserror.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
zeroize.workspace = true

[dev-dependencies]
uniffi = { version = "0.28", features = ["bindgen"] }
tempfile = "3"
