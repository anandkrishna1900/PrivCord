[package]
name = "privcord-crypto"
description = "PrivCord cryptography: identity recovery, signatures, key agreement, sealed blobs, invites, channels and backups. Wire-compatible with the TypeScript and Kotlin implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Deterministic randomness for reproducible tests. Never enable in a shipped build.
test-support = []

[dependencies]
privcord-domain.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
sha2.workspace = true
hkdf.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
aes-gcm.workspace = true
p256.workspace = true
k256.workspace = true
bip39.workspace = true
ml-kem.workspace = true
argon2.workspace = true
getrandom.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
proptest.workspace = true
privcord-crypto = { path = ".", features = ["test-support"] }

[[example]]
name = "gen_vectors"
required-features = ["test-support"]
