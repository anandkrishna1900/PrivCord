name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The desktop signaling test runs against the real relay, so its dependencies come first.
      - name: Relay dependencies
        working-directory: relay
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:desktop
      - name: Relay tests
        working-directory: relay
        run: npm test
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (real browsers, relay, Nostr, TURN)
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd relay && npm ci
      - name: Playwright (global, as the suite expects)
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium
      - run: npm run e2e --workspace @duochat/desktop

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Android interop tests start the real relay and a Nostr relay with node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relay dependencies
        working-directory: relay
        run: npm ci
      # The runner image already ships the Android SDK; just accept its licenses so Gradle can fetch platform 35.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  windows-installer:
    name: Windows installer (unsigned) build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Build installer (also proves the Rust crate, including Bluetooth, compiles)
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-windows-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
