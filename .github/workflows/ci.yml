name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The desktop signaling test runs against the real relay, so its dependencies come first.
      - name: Relay dependencies
        working-directory: relay
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:desktop
      - name: Relay tests
        working-directory: relay
        run: npm test
      - run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      # The relay client is tested against the real relay (Node + its `ws` package), so install the JS dependencies first.
      - run: npm ci
        if: matrix.os == 'ubuntu-latest'
      # The Nostr client is tested against an independent real relay (Python `nostr-relay`). Python 3.12 has prebuilt
      # wheels for its dependencies; the runner's default (3.14) tries to build coincurve from source and fails.
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.12'
      - run: pip install nostr-relay==1.14
        if: matrix.os == 'ubuntu-latest'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
        env:
          # No Node dependencies or Python relay on the Windows runner: the real-relay tests run on Linux.
          PRIVCORD_SKIP_REAL_RELAY: ${{ matrix.os == 'windows-latest' && '1' || '' }}
          PRIVCORD_SKIP_REAL_NOSTR: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      # The Rust-made vectors must be reproducible, and the TypeScript tests must still open them.
      - name: Rust vectors are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -q --locked -p privcord-crypto --features test-support --example gen_vectors > /tmp/rust-vectors.json
          diff /tmp/rust-vectors.json docs/rust-vectors.json
      - name: TypeScript opens what Rust produced
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm ci
          npm test --workspace @duochat/protocol -- rustInterop
      - name: TypeScript-made vectors are reproducible
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd packages/protocol
          npx vite-node scripts/gen-misc-vectors.ts
          git diff --exit-code ../../docs/misc-vectors.json
      - name: Kotlin bindings match the committed API snapshot
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --locked -p privcord-ffi --features cli
          target/debug/uniffi-bindgen generate --library target/debug/libprivcord_ffi.so --language kotlin --out-dir /tmp/bindings
          diff -r /tmp/bindings crates/privcord-ffi/bindings/kotlin
      - name: Migration map is complete and current
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 docs/rust/tools/gen_migration_map.py
          git diff --exit-code docs/rust/MIGRATION_MAP.md
      - name: Pure crates build for the other declared targets
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add aarch64-linux-android x86_64-pc-windows-gnu aarch64-unknown-linux-gnu
          for t in aarch64-linux-android x86_64-pc-windows-gnu aarch64-unknown-linux-gnu; do
            cargo check --locked --target "$t" -p privcord-domain -p privcord-crypto -p privcord-ports -p privcord-engine
          done
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --locked
          cargo audit

  e2e:
    name: End-to-end (real browsers, relay, Nostr, TURN)
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd relay && npm ci
      - name: Playwright (global, as the suite expects)
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium
      - run: npm run e2e --workspace @duochat/desktop
      # The built desktop app against the Rust engine as a separate process, over the simulated Bluetooth radio.
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p privcord-engine --example peer --locked
      - run: node apps/desktop/e2e/rust-peer.mjs

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Android interop tests start the real relay and a Nostr relay with node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relay dependencies
        working-directory: relay
        run: npm ci
      # The runner image already ships the Android SDK; just accept its licenses so Gradle can fetch platform 35.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      # The Rust core, built for the four phone CPU types and packed into the APK (apps/android/app/src/main/jniLibs).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the Rust core for Android
        # The runner sets ANDROID_NDK_ROOT (not ANDROID_NDK_LATEST_HOME on this image).
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o apps/android/app/src/main/jniLibs build -p privcord-ffi --release --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        working-directory: apps/android
        run: ./gradlew :app:testClassicDebugUnitTest :app:assembleClassicDebug :app:assembleRustDebug --console=plain
      - name: The APK contains the Rust core for every CPU type
        run: |
          unzip -l apps/android/app/build/outputs/apk/classic/debug/app-classic-debug.apk | grep libprivcord_ffi.so | tee /tmp/libs.txt
          test "$(wc -l < /tmp/libs.txt)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-android-debug
          path: apps/android/app/build/outputs/apk/classic/debug/app-classic-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-android-rust-preview
          path: apps/android/app/build/outputs/apk/rust/debug/app-rust-debug.apk

  windows-installer:
    name: Windows installer (unsigned) build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Build installer (also proves the Rust crate, including Bluetooth, compiles)
        # Tauri downloads its NSIS packager from github.com at the end of the build; that download has been returning
        # HTTP 504. The compile is cached after the first attempt, so retrying only repeats the download.
        shell: pwsh
        run: |
          for ($i = 1; $i -le 4; $i++) {
            npm run tauri:build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "tauri build failed (attempt $i of 4); retrying in 60 s"
            Start-Sleep -Seconds 60
          }
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-windows-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
