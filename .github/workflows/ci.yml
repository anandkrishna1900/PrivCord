name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:desktop
      - name: Relay tests
        working-directory: relay
        run: npm ci && npm test
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (real browsers, relay, Nostr, TURN)
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd relay && npm ci
      - name: Playwright (global, as the suite expects)
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium
      - run: npm run e2e --workspace @duochat/desktop

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

  tauri-check:
    name: Tauri (Rust) compile check on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:desktop
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
