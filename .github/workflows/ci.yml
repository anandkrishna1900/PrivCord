name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The desktop signaling test runs against the real relay, so its dependencies come first.
      - name: Relay dependencies
        working-directory: relay
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:desktop
      - name: Relay tests
        working-directory: relay
        run: npm test
      - run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
      # The relay client is tested against the real relay (Node + its `ws` package), so install the JS dependencies first.
      - run: npm ci
        if: matrix.os == 'ubuntu-latest'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
        env:
          # No Node dependencies on the Windows runner: the real-relay test runs on Linux.
          PRIVCORD_SKIP_REAL_RELAY: ${{ matrix.os == 'windows-latest' && '1' || '' }}
      # The Rust-made vectors must be reproducible, and the TypeScript tests must still open them.
      - name: Rust vectors are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run -q --locked -p privcord-crypto --features test-support --example gen_vectors > /tmp/rust-vectors.json
          diff /tmp/rust-vectors.json docs/rust-vectors.json
      - name: TypeScript opens what Rust produced
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm ci
          npm test --workspace @duochat/protocol -- rustInterop
      - name: TypeScript-made vectors are reproducible
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd packages/protocol
          npx vite-node scripts/gen-misc-vectors.ts
          git diff --exit-code ../../docs/misc-vectors.json
      - name: Kotlin bindings match the committed API snapshot
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --locked -p privcord-ffi --features cli
          target/debug/uniffi-bindgen generate --library target/debug/libprivcord_ffi.so --language kotlin --out-dir /tmp/bindings
          diff -r /tmp/bindings crates/privcord-ffi/bindings/kotlin
      - name: Migration map is complete and current
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 docs/rust/tools/gen_migration_map.py
          git diff --exit-code docs/rust/MIGRATION_MAP.md
      - name: Pure crates build for the other declared targets
        if: matrix.os == 'ubuntu-latest'
        run: |
          rustup target add aarch64-linux-android x86_64-pc-windows-gnu aarch64-unknown-linux-gnu
          for t in aarch64-linux-android x86_64-pc-windows-gnu aarch64-unknown-linux-gnu; do
            cargo check --locked --target "$t" -p privcord-domain -p privcord-crypto -p privcord-ports -p privcord-engine
          done
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-audit --locked
          cargo audit

  e2e:
    name: End-to-end (real browsers, relay, Nostr, TURN)
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cd relay && npm ci
      - name: Playwright (global, as the suite expects)
        run: |
          npm install -g playwright
          npx playwright install --with-deps chromium
      - run: npm run e2e --workspace @duochat/desktop

  android:
    name: Android unit tests and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Android interop tests start the real relay and a Nostr relay with node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Relay dependencies
        working-directory: relay
        run: npm ci
      # The runner image already ships the Android SDK; just accept its licenses so Gradle can fetch platform 35.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

  windows-installer:
    name: Windows installer (unsigned) build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - name: Build installer (also proves the Rust crate, including Bluetooth, compiles)
        run: npm run tauri:build
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-windows-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
