name: Test builds

# Manual: builds UNSIGNED installers you can download and try (Actions run > Artifacts).
# Not for distribution: see docs/DEPLOYMENT.md for signed releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer (unsigned)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build
      - uses: actions/upload-artifact@v7
        with:
          name: duochat-windows-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Relay dependencies
        working-directory: relay
        run: npm ci
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: apps/android
        run: ./gradlew :app:assembleClassicDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: duochat-android-debug
          path: apps/android/app/build/outputs/apk/classic/debug/app-classic-debug.apk
