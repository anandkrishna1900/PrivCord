name: Release

# Builds the Windows installer and the Android release bundle when a version tag is pushed.
# Signing secrets are optional: without them the artifacts are UNSIGNED and must not be
# distributed publicly (see docs/DEPLOYMENT.md).
on:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build installer
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release bundle
        working-directory: apps/android
        run: ./gradlew :app:bundleRelease :app:assembleRelease --console=plain
        env:
          DUOCHAT_KEYSTORE_B64: ${{ secrets.DUOCHAT_KEYSTORE_B64 }}
          DUOCHAT_KEYSTORE_PASSWORD: ${{ secrets.DUOCHAT_KEYSTORE_PASSWORD }}
          DUOCHAT_KEY_ALIAS: ${{ secrets.DUOCHAT_KEY_ALIAS }}
          DUOCHAT_KEY_PASSWORD: ${{ secrets.DUOCHAT_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: duochat-android
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/release/*.apk

  relay-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: relay
          push: true
          tags: ghcr.io/${{ github.repository }}/relay:${{ github.ref_name }}
