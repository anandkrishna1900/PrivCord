name: Release

# Builds the Windows installer and the Android release bundle when a version tag is pushed.
# Signing secrets are optional: without them the artifacts are UNSIGNED and must not be
# distributed publicly (see docs/DEPLOYMENT.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - name: Build installer
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_PRIVCORD_TURN_URLS: ${{ secrets.PRIVCORD_TURN_URLS }}
          VITE_PRIVCORD_TURN_USERNAME: ${{ secrets.PRIVCORD_TURN_USERNAME }}
          VITE_PRIVCORD_TURN_CREDENTIAL: ${{ secrets.PRIVCORD_TURN_CREDENTIAL }}
      - uses: actions/upload-artifact@v7
        with:
          name: duochat-windows
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      # The Rust core, built for the two phone CPU types and packed into the APK (apps/android/app/src/main/jniLibs).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build the Rust core for Android
        # The runner sets ANDROID_NDK_ROOT (not ANDROID_NDK_LATEST_HOME on this image).
        # Optimised for size on phones (messages and files are small; the APK download is not).
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o apps/android/app/src/main/jniLibs build -p privcord-ffi --release --locked
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: Build release bundle
        working-directory: apps/android
        run: ./gradlew :app:bundleRelease :app:assembleRelease --console=plain
        env:
          DUOCHAT_KEYSTORE_B64: ${{ secrets.DUOCHAT_KEYSTORE_B64 }}
          DUOCHAT_KEYSTORE_PASSWORD: ${{ secrets.DUOCHAT_KEYSTORE_PASSWORD }}
          DUOCHAT_KEY_ALIAS: ${{ secrets.DUOCHAT_KEY_ALIAS }}
          PRIVCORD_TURN_URLS: ${{ secrets.PRIVCORD_TURN_URLS }}
          PRIVCORD_TURN_USERNAME: ${{ secrets.PRIVCORD_TURN_USERNAME }}
          PRIVCORD_TURN_CREDENTIAL: ${{ secrets.PRIVCORD_TURN_CREDENTIAL }}
          DUOCHAT_KEY_PASSWORD: ${{ secrets.DUOCHAT_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: duochat-android
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/release/*.apk

  relay-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: relay
          push: true
          tags: ghcr.io/${{ github.repository }}/relay:${{ github.ref_name }}
