# Replace the three CHANGE_ME values, then keep the same values for make-share-line.mjs.
listening-port=3478
external-ip=CHANGE_ME_PUBLIC_IP
realm=privcord
lt-cred-mech
user=privcord:CHANGE_ME_LONG_RANDOM_PASSWORD
fingerprint
no-multicast-peers
no-cli
# bandwidth caps: per user and for the whole server (the credentials ship inside the apps when built in)
user-quota=12
total-quota=300
max-bps=1500000
bps-capacity=50000000
stale-nonce=600
no-tlsv1
no-tlsv1_1
no-software-attribute
# relay ports (open these in the firewall)
min-port=49152
max-port=49252
# never let a relay client reach private networks on the server's side
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
# the relay only carries encrypted PrivCord traffic; keep logs minimal
no-stdout-log
